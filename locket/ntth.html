<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active & Kiểm tra Locket Gold</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #18191c 0%, #0d0e11 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 650px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 16px;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(90deg, #ffd700, #ffae00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn-refresh {
            background: linear-gradient(135deg, #f5a623, #f76b1c);
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-refresh:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        /* Result Card */
        .status-card {
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .status-card.loading {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .status-card.gold-active {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.15), rgba(255, 174, 0, 0.05));
            border: 1px solid #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
        }

        .status-card.gold-inactive {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid #ef4444;
        }

        .badge-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 15px;
            font-weight: 700;
            padding: 6px 12px;
            border-radius: 20px;
            margin-bottom: 12px;
        }

        .badge-active {
            background: #ffd700;
            color: #1a1a1a;
        }

        .badge-inactive {
            background: #ef4444;
            color: #ffffff;
        }

        .badge-loading {
            background: #6b7280;
            color: #ffffff;
        }

        .details-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 14px;
        }

        .detail-item {
            background: rgba(0, 0, 0, 0.25);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
        }

        .detail-label {
            color: #9ca3af;
            font-size: 12px;
            margin-bottom: 4px;
        }

        .detail-value {
            font-weight: 600;
            color: #f3f4f6;
            word-break: break-all;
        }

        .highlight-gold {
            color: #ffd700;
        }

        /* Debug / JSON Log */
        .toggle-json {
            font-size: 13px;
            color: #9ca3af;
            cursor: pointer;
            margin-bottom: 8px;
            display: inline-block;
            text-decoration: underline;
        }

        pre {
            background: #111215;
            color: #10b981;
            padding: 16px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 12px;
            white-space: pre-wrap;
            word-wrap: break-word;
            border: 1px solid rgba(255, 255, 255, 0.05);
            max-height: 250px;
            overflow-y: auto;
        }
    </style>
</head>

<body>
